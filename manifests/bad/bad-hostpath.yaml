apiVersion: v1
kind: Pod
metadata:
  name: bad-hostpath
  namespace: web
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "1000000"]
    volumeMounts:
    - name: host-etc
      mountPath: /host-etc
      readOnly: true
    resources:
      limits: {cpu: "100m", memory: "64Mi"}
  volumes:
  - name: host-etc
    hostPath:
      path: /etc
