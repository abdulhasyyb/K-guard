apiVersion: v1
kind: ServiceAccount
metadata:
  name: over-privileged-sa
  namespace: payments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: over-privileged-sa-admin
subjects:
- kind: ServiceAccount
  name: over-privileged-sa
  namespace: payments
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-rbac
  namespace: payments
spec:
  serviceAccountName: over-privileged-sa
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "1000000"]
    resources:
      limits: {cpu: "100m", memory: "64Mi"}
