apiVersion: v1
kind: Pod
metadata:
  name: bad-root
  namespace: payments
  labels:
    kguard.io/remediated: "true"
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "1000000"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests: {cpu: "50m", memory: "32Mi"}
      limits: {cpu: "100m", memory: "64Mi"}
