apiVersion: v1
kind: Pod
metadata:
  name: good-web
  namespace: web
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "1000000"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      limits: {cpu: "100m", memory: "64Mi"}
